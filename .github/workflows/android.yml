name: Build release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ModAnzer.ps1'
      - 'ModAnzer.ico'
      - 'ModAnzer.bat'
      - 'exe/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ModAnzer.exe
        run: dotnet build exe/ModAnzer.App.csproj -c Release -o exe-out

      - name: Screenshot of the window
        shell: pwsh
        run: |
          $p = Start-Process exe-out/ModAnzer.exe -ArgumentList '--screenshot', "$PWD\preview.png" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'screenshot timed out' }
          if (-not (Test-Path preview.png)) { throw 'no screenshot' }
          $p = Start-Process exe-out/ModAnzer.exe -ArgumentList '--screenshot', "$PWD\scan.png", '--scan', 'system' -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw 'scan timed out' }
          Get-Content scan.png.txt | Select-Object -Last 60
          foreach ($f in 'preview.png', 'scan.png') {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$f"))
            Write-Output "PNG-BEGIN $f"; for ($i = 0; $i -lt $b.Length; $i += 4000) { Write-Output ('PNG ' + $b.Substring($i, [Math]::Min(4000, $b.Length - $i))) }; Write-Output "PNG-END $f"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            exe-out/ModAnzer.exe
            preview.png
            scan.png

  build:
    needs: exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: exe-artifact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.MODANZER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/modanzer.jks"
            echo "MODANZER_KEYSTORE_FILE=$RUNNER_TEMP/modanzer.jks" >> "$GITHUB_ENV"
            echo "Signing with the private release key."
          else
            echo "::warning::MODANZER_KEYSTORE_BASE64 secret not set - signing with a temporary debug key."
          fi

      - name: Build APK
        env:
          MODANZER_KEYSTORE_PASSWORD: ${{ secrets.MODANZER_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish to the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/modanzer.jks"
          cp android/app/build/outputs/apk/release/app-release.apk ModAnzer.apk
          cp exe-artifact/exe-out/ModAnzer.exe ModAnzer.exe 2>/dev/null || cp exe-artifact/ModAnzer.exe ModAnzer.exe
          sha256sum ModAnzer.exe ModAnzer.apk ModAnzer.ps1 ModAnzer.bat ModAnzer.ico > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "ModAnzer build #${{ github.run_number }} from commit ${{ github.sha }}."
            echo
            echo "- **ModAnzer.exe**: Windows app. Double-click it, pick a check, press Start scan."
            echo "- **ModAnzer.apk**: Android app. Open it on your phone to install."
            echo "- **ModAnzer.bat**: Windows launcher. Double-click it to run ModAnzer."
            echo "- **ModAnzer.ps1**: Windows script. See the README for how to run it."
            echo "- **ModAnzer.ico**: icon for a desktop shortcut to the script."
            echo
            echo "SHA256 checksums:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ModAnzer.exe ModAnzer.apk ModAnzer.bat ModAnzer.ps1 ModAnzer.ico SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "ModAnzer (Android + Windows)" \
            --notes-file notes.md
