name: Build release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'windows/**'
      - 'ModAnzer.ps1'
      - 'ModAnzer.ico'
      - 'ModAnzer.bat'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only one build publishes at a time, so two runs can't remove each other's release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build ModAnzer.jar
        run: mvn -B -f windows/pom.xml package

      - name: Smoke test on Windows
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($m in 'mods', 'system', 'injection') {
            Write-Output "=== $m ==="
            java --enable-native-access=ALL-UNNAMED -jar windows/target/ModAnzer.jar --cli --mode $m --no-send --offline --live-seconds 3 2>&1 | Select-Object -Last 60
          }

      - name: Make the Windows app (Java included)
        shell: pwsh
        run: |
          New-Item -ItemType Directory jpackage-in | Out-Null
          Copy-Item windows/target/ModAnzer.jar jpackage-in/
          jpackage --type app-image --name ModAnzer --input jpackage-in --main-jar ModAnzer.jar `
            --main-class com.napatc1.modanzer.Main --icon ModAnzer.ico --dest dist `
            --add-modules java.base,java.desktop,java.net.http,java.logging,java.prefs `
            --java-options '--enable-native-access=ALL-UNNAMED' `
            --app-version "1.0.${{ github.run_number }}" --vendor napatc1 `
            --jlink-options '--strip-debug --no-header-files --no-man-pages'
          if (-not (Test-Path dist/ModAnzer/ModAnzer.exe)) { throw 'jpackage did not make ModAnzer.exe' }

          # ModAnzer.exe: one file you double-click. It unpacks the app next to it in Temp and starts it.
          # ModAnzer-Windows.zip: the same app as a plain folder, for when antivirus blocks the single file.
          Compress-Archive -Path dist/ModAnzer -DestinationPath ModAnzer-Windows.zip
          $sevenZip = 'C:\Program Files\7-Zip'
          & "$sevenZip\7z.exe" a -mx=7 payload.7z .\dist\ModAnzer | Out-Null
          if (-not (Test-Path "$sevenZip\7z.sfx")) { throw '7z.sfx not found' }
          Set-Content -Path sfx.txt -Encoding utf8 -Value @(';!@Install@!UTF-8!', 'RunProgram="ModAnzer\ModAnzer.exe"', 'GUIMode="2"', ';!@InstallEnd@!')
          cmd /c copy /b "$sevenZip\7z.sfx" + sfx.txt + payload.7z ModAnzer.exe
          Copy-Item windows/target/ModAnzer.jar ModAnzer.jar

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ModAnzer.exe
            ModAnzer.jar
            ModAnzer-Windows.zip

  build:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows-artifact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.MODANZER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/modanzer.jks"
            echo "MODANZER_KEYSTORE_FILE=$RUNNER_TEMP/modanzer.jks" >> "$GITHUB_ENV"
            echo "Signing with the private release key."
          else
            echo "::warning::MODANZER_KEYSTORE_BASE64 secret not set - signing with a temporary debug key."
          fi

      - name: Build APK
        env:
          MODANZER_KEYSTORE_PASSWORD: ${{ secrets.MODANZER_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish to the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/modanzer.jks"
          cp android/app/build/outputs/apk/release/app-release.apk ModAnzer.apk
          cp windows-artifact/ModAnzer.exe windows-artifact/ModAnzer.jar windows-artifact/ModAnzer-Windows.zip .
          sha256sum ModAnzer.exe ModAnzer.jar ModAnzer-Windows.zip ModAnzer.apk ModAnzer.bat ModAnzer.ico > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "ModAnzer build #${{ github.run_number }} from commit ${{ github.sha }}."
            echo
            echo "- **ModAnzer.exe**: Windows app. Double-click it, pick a check, press Start scan. Java is built in."
            echo "- **ModAnzer-Windows.zip**: the same Windows app as a folder, if antivirus blocks ModAnzer.exe."
            echo "- **ModAnzer.jar**: the Windows app for people who already have Java 22 or newer."
            echo "- **ModAnzer.apk**: Android app. Open it on your phone to install."
            echo "- **ModAnzer.bat**: runs ModAnzer.jar (downloads it first if needed)."
            echo "- **ModAnzer.ico**: icon for a desktop shortcut."
            echo
            echo "SHA256 checksums:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          # Update the release in place. It is never deleted, so the download links keep working
          # even if a step here fails.
          if ! gh release view apk >/dev/null 2>&1; then
            gh release create apk --target "${{ github.sha }}" --title "ModAnzer (Android + Windows)" --notes-file notes.md
          fi
          gh release upload apk ModAnzer.exe ModAnzer-Windows.zip ModAnzer.jar ModAnzer.apk ModAnzer.bat ModAnzer.ico SHA256SUMS.txt --clobber
          gh release edit apk --title "ModAnzer (Android + Windows)" --notes-file notes.md
          for old in ModAnzer.ps1; do gh release delete-asset apk "$old" --yes 2>/dev/null || true; done
          # point the apk tag at this build
          git tag -f apk "${{ github.sha }}"
          git push -f origin refs/tags/apk
